name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install flake8 isort
      - run: flake8 seatmap_pro tests
      - run: isort --check-only --diff seatmap_pro tests

  pretix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pretix: ['pretix==2026.9.3', 'pretix']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install '${{ matrix.pretix }}' -e . pytest pytest-django beautifulsoup4 jsonschema
      - name: Run unit and host flow tests
        run: |
          SEATING_PLAN_SCHEMA="$(python -c 'import pathlib, pretix; print(pathlib.Path(pretix.__file__).parent / "static/seating/seating-plan.schema.json")')" \
            pytest tests --ds=pretix.testutils.settings
